[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "preflightops"
dynamic = ["version"]
description = "Pre-deployment risk assessment for SRE, DevOps and Platform Engineering teams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Pedro Jose Luna Salmon" },
]
keywords = [
    "sre",
    "devops",
    "risk",
    "deployment",
    "ci",
    "terraform",
    "kubernetes",
    "platform-engineering",
    "change-management",
    "production-readiness",
    "incident-prevention",
    "github-actions",
    "rollback",
    "observability",
    "itil",
    "cloud-operations",
]
dependencies = [
    "cryptography>=45,<51",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/pedroluna-gh/preflightops"
Repository = "https://github.com/pedroluna-gh/preflightops"
Documentation = "https://github.com/pedroluna-gh/preflightops#readme"
Issues = "https://github.com/pedroluna-gh/preflightops/issues"

[project.optional-dependencies]
# Extras needed only to run the Streamlit web UI (`streamlit run app.py`).
app = [
    "streamlit>=1.40,<2",
    "pandas>=2.0,<3",
]
# Extras needed only to run the automated test suite (`pytest`).
test = [
    "pytest>=9.0.3,<10",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
quality = [
    "build>=1.3,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "setuptools==83.0.0",
    "twine>=6,<7",
    "types-pyyaml>=6,<7",
    "wheel>=0.45,<1",
]

[project.scripts]
preflightops = "preflightops.cli:main"

[tool.setuptools]
packages = ["preflightops"]

[tool.setuptools.dynamic]
version = { attr = "preflightops._version.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".package-check",
    ".package-check-2",
    ".pytest-cache-*",
    ".pytest-run-*",
    ".tooling",
    ".uv-cache",
    ".venv-checks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "^(app\\.py|tests/)"

[tool.coverage.run]
branch = true
source = ["preflightops"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
