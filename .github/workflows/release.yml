name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Dependency audit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install locked audit tooling
        run: uv sync --locked --group quality --no-install-project

      - name: Export runtime and toolchain dependencies for Python ${{ matrix.python }}
        run: |
          uv export --python "${{ matrix.python }}" --locked --no-dev --extra app --no-emit-project --format requirements-txt --output-file ".dependency-audit-runtime-${{ matrix.python }}.txt"
          uv export --python "${{ matrix.python }}" --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file ".dependency-audit-toolchain-${{ matrix.python }}.txt"

      - name: Audit runtime and toolchain dependencies for Python ${{ matrix.python }}
        run: |
          uv run pip-audit --requirement ".dependency-audit-runtime-${{ matrix.python }}.txt"
          uv run pip-audit --requirement ".dependency-audit-toolchain-${{ matrix.python }}.txt"

  build-attest-release:
    name: Build, attest and publish
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(python -c 'from preflightops import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Install frozen build environment
        run: uv sync --locked --all-extras --group quality

      - name: Run release gates
        run: |
          uv run pytest --cov=preflightops --cov-report=term-missing --cov-fail-under=85
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy preflightops

      - name: Build distributions once
        run: uv run python -m build --no-isolation

      - name: Validate distributions
        run: uv run twine check dist/*

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/preflightops.spdx.json
          artifact-name: preflightops-sbom
          upload-release-assets: false

      - name: Create checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Preserve immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflightops-${{ github.ref_name }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub release from the verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
