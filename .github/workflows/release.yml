name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Dependency audit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install locked audit tooling
        run: uv sync --locked --group quality --no-install-project

      - name: Export runtime and toolchain dependencies for Python ${{ matrix.python }}
        run: |
          uv export --python "${{ matrix.python }}" --locked --no-dev --extra app --no-emit-project --format requirements-txt --output-file ".dependency-audit-runtime-${{ matrix.python }}.txt"
          uv export --python "${{ matrix.python }}" --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file ".dependency-audit-toolchain-${{ matrix.python }}.txt"

      - name: Audit runtime and toolchain dependencies for Python ${{ matrix.python }}
        run: |
          uv run pip-audit --requirement ".dependency-audit-runtime-${{ matrix.python }}.txt"
          uv run pip-audit --requirement ".dependency-audit-toolchain-${{ matrix.python }}.txt"

  build-attest-release:
    name: Build, attest and publish
    needs: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(python -c 'from preflightops import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Install frozen build environment
        run: uv sync --locked --all-extras --group quality

      - name: Run release gates
        run: |
          uv run python scripts/security_exceptions.py security/exceptions.json
          uv run pytest --cov=preflightops --cov-report=term-missing --cov-fail-under=85
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy preflightops

      - name: Verify reproducible distributions and promote one bundle
        run: uv run python scripts/release_build.py --output dist --epoch 1704067200

      - name: Validate distributions
        run: uv run twine check dist/*.whl dist/*.tar.gz

      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .runtime-requirements.txt

      - name: Test clean release wheel and risk exit contracts
        run: uv run python scripts/package_smoke.py --requirements .runtime-requirements.txt dist

      - name: Stage bounded SBOM inputs
        run: uv run python scripts/sbom_input.py dist .sbom-input

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        with:
          syft-version: v1.52.0
          path: .sbom-input
          format: spdx-json
          output-file: dist/preflightops.spdx.json
          artifact-name: preflightops-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Verify complete locked SBOM
        run: uv run python scripts/lock_sbom.py dist/preflightops-lock.cdx.json

      - name: Create checksums
        run: uv run python scripts/release_bundle.py create dist

      - name: Verify exact release bundle offline
        run: uv run python scripts/release_bundle.py verify dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Preserve immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflightops-${{ github.ref_name }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Require current license approval before publishing
        run: uv run python scripts/license_review.py security/license-review.json --publishing

      - name: Publish GitHub release from the verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
