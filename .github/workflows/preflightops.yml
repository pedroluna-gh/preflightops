name: PreflightOps adoption example

# This manual workflow demonstrates product adoption with examples that are
# shipped in this repository. The mandatory engineering gates live in ci.yml.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Example risk scenario
        required: true
        default: low
        type: choice
        options:
          - low
          - high
          - critical

permissions:
  contents: read

jobs:
  example:
    name: Assess ${{ inputs.scenario }} example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run the local composite action
        id: assess
        uses: ./
        with:
          services: examples/services-${{ inputs.scenario }}-risk.yaml
          change: examples/change-${{ inputs.scenario }}-risk.yaml
          output: preflightops-report.md
          json-output: preflightops-report.json
          html-output: preflightops-report.html
          github-comment-output: preflightops-comment.md
          fail-on: none

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## PreflightOps adoption example"
            echo
            echo "Risk: **${{ steps.assess.outputs.risk-level }}**"
            echo "Score: **${{ steps.assess.outputs.risk-score }}/100**"
            echo
            cat preflightops-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflightops-${{ inputs.scenario }}-risk
          path: |
            preflightops-report.md
            preflightops-report.json
            preflightops-report.html
            preflightops-comment.md
          if-no-files-found: error
