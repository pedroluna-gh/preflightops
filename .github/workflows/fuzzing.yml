name: Fuzzing

on:
  pull_request:
    paths:
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzzing.yml"
      - "fuzz/**"
      - "preflightops/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzzing.yml"
      - "fuzz/**"
      - "preflightops/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clusterfuzzlite:
    name: ClusterFuzzLite
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Build fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main 2026-02-12
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address

      - name: Run fuzz targets
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main 2026-02-12
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'schedule' && '900' || '180' }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address
          output-sarif: true

