name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock and install quality environment
        run: uv sync --locked --all-extras --group quality

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy preflightops

      - name: Test with branch coverage
        run: uv run pytest --cov=preflightops --cov-report=term-missing --cov-fail-under=85

      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .runtime-requirements.txt

      - name: Build distributions
        run: uv run python -m build --no-isolation

      - name: Validate distribution metadata
        run: uv run twine check dist/*

      - name: Test clean wheel installation and CLI
        run: uv run python scripts/package_smoke.py --requirements .runtime-requirements.txt dist

  compatibility:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2025
            python: "3.12"
          - os: macos-15
            python: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install from the frozen lockfile
        run: uv sync --locked --all-extras --no-dev

      - name: Run regression suite
        run: uv run --no-dev pytest

  dependency-audit:
    name: Dependency audit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked audit tooling
        run: uv sync --locked --group quality --no-install-project

      - name: Export runtime and toolchain dependencies for Python ${{ matrix.python }}
        run: |
          uv export --python "${{ matrix.python }}" --locked --no-dev --extra app --no-emit-project --format requirements-txt --output-file ".dependency-audit-runtime-${{ matrix.python }}.txt"
          uv export --python "${{ matrix.python }}" --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file ".dependency-audit-toolchain-${{ matrix.python }}.txt"

      - name: Audit runtime and toolchain dependencies for Python ${{ matrix.python }}
        run: |
          uv run pip-audit --requirement ".dependency-audit-runtime-${{ matrix.python }}.txt"
          uv run pip-audit --requirement ".dependency-audit-toolchain-${{ matrix.python }}.txt"

  action-contract:
    name: Composite action contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: LOW risk must pass
        id: low
        uses: ./
        with:
          services: examples/services-low-risk.yaml
          change: examples/change-low-risk.yaml
          auto-detect-changes: "false"
          output: low-report.md
          json-output: low-report.json
          fail-on: critical

      - name: Assert LOW contract
        shell: bash
        run: |
          test "${{ steps.low.outputs.risk-level }}" = "LOW"
          test -s low-report.md
          test -s low-report.json
          test -s "${{ steps.low.outputs.github-comment-path }}"

      - name: CRITICAL risk must fail the risk gate
        id: critical
        continue-on-error: true
        uses: ./
        with:
          services: examples/services-critical-risk.yaml
          change: examples/change-critical-risk.yaml
          terraform: examples/terraform-critical.txt
          auto-detect-changes: "false"
          output: critical-report.md
          json-output: critical-report.json
          fail-on: critical

      - name: Assert CRITICAL contract
        if: always()
        shell: bash
        run: |
          test "${{ steps.critical.outcome }}" = "failure"
          test "${{ steps.critical.outputs.risk-level }}" = "CRITICAL"
          test -s critical-report.md
          test -s critical-report.json
          test -s "${{ steps.critical.outputs.github-comment-path }}"


  required:
    name: Required
    needs: [quality, compatibility, dependency-audit, action-contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required CI contracts
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          ACTION_CONTRACT_RESULT: ${{ needs.action-contract.result }}
        shell: bash
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$ACTION_CONTRACT_RESULT" = "success"
