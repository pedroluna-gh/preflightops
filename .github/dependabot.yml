version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Montevideo
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Montevideo
    open-pull-requests-limit: 5
    groups:
      quality-tooling:
        dependency-type: development
    labels: [dependencies, security]
