name: "PreflightOps"
description: "SRE pre-change risk gate with auditable pre-CAB evidence for ServiceNow, Jira, Terraform, Kubernetes, and observability."
author: "Pedro Jose Luna Salmon"
branding:
  icon: "shield"
  color: "red"

inputs:
  services:
    description: "Path to the service catalog YAML file."
    required: true
  change:
    description: "Path to the change request YAML file."
    required: true
  terraform:
    description: "Optional path to a Terraform plan/diff text file."
    required: false
    default: ""
  terraform-json:
    description: "Optional structured Terraform plan from 'terraform show -json'."
    required: false
    default: ""
  k8s:
    description: "Optional path to a Kubernetes manifest YAML file."
    required: false
    default: ""
  policy:
    description: "Built-in policy pack name or path to a versioned policy YAML file."
    required: false
    default: ""
  policy-public-key:
    description: "Trusted Ed25519 public-key path for an active Policy Bundle v2. Public material only."
    required: false
    default: ""
  waiver:
    description: "Optional signed Waiver Contract v1 path. It records an exception but never approves the change or lowers technical risk."
    required: false
    default: ""
  waiver-public-key:
    description: "Trusted Ed25519 public-key path for waiver verification. Public material only."
    required: false
    default: ""
  monitors:
    description: "Optional offline observability monitor inventory YAML file."
    required: false
    default: ""
  changed-files:
    description: "Optional newline/JSON changed-file manifest. In pull requests this is detected automatically when blank."
    required: false
    default: ""
  auto-detect-changes:
    description: "Fetch pull-request filenames with the GitHub token and infer scanner scope."
    required: false
    default: "true"
  output:
    description: "Path to write the Markdown report."
    required: false
    default: "preflightops-report.md"
  json-output:
    description: "Path to write the JSON report."
    required: false
    default: "preflightops-report.json"
  evidence-v2-output:
    description: "Optional path for signed DSSE Evidence Contract v2. Requires PREFLIGHTOPS_EVIDENCE_PRIVATE_KEY in the step environment."
    required: false
    default: ""
  evidence-v1-output:
    description: "Optional compatibility v1 evidence path, emitted together with v2 during migration."
    required: false
    default: ""
  evidence-data-classification:
    description: "Evidence data classification: public, internal, confidential, or restricted."
    required: false
    default: "internal"
  html-output:
    description: "Optional path to write a static HTML report."
    required: false
    default: ""
  github-comment-output:
    description: "Path to write a compact Markdown pull-request comment."
    required: false
    default: "preflightops-comment.md"
  assessment-contract:
    description: "Optional Assessment Contract v1 JSON path rendered into additive auditable outputs."
    required: false
    default: ""
  assessment-report-json-output:
    description: "Explicit path for canonical Assessment Report v1 JSON. Requires assessment-contract."
    required: false
    default: ""
  assessment-report-markdown-output:
    description: "Explicit path for the full Assessment Report v1 Markdown. Requires assessment-contract."
    required: false
    default: ""
  assessment-pr-summary-output:
    description: "Explicit path for the bounded Assessment Contract PR summary. Requires assessment-contract."
    required: false
    default: ""
  assessment-ticket-summary-output:
    description: "Explicit path for the bounded Assessment Contract ticket summary. Requires assessment-contract."
    required: false
    default: ""
  assessment-automation-details:
    description: "Include bounded Automation Details in Assessment Contract reports."
    required: false
    default: "true"
  full-report-url:
    description: "Optional workflow or artifact URL linked from human-readable reports."
    required: false
    default: ""
  ticket-output:
    description: "Optional path to write a ServiceNow/Jira-ready change ticket summary."
    required: false
    default: ""
  ticket-template:
    description: "Optional path to a YAML or JSON ticket template."
    required: false
    default: ""
  servicenow:
    description: "Optional ServiceNow instance URL for opt-in live evidence publication. Authentication uses SERVICENOW_TOKEN (preferred) or SERVICENOW_USER / SERVICENOW_PASSWORD from GitHub Actions secrets."
    required: false
    default: ""
  servicenow-mapping:
    description: "Optional versioned ServiceNow field mapping YAML/JSON file."
    required: false
    default: ""
  servicenow-change:
    description: "Existing ServiceNow Change number or sys_id to enrich. Missing records fail closed."
    required: false
    default: ""
  servicenow-attach-evidence:
    description: "Attach the versioned JSON evidence package and deduplicate it by SHA-256."
    required: false
    default: "false"
  servicenow-dry-run:
    description: "Validate and render the ServiceNow payload without credentials or network calls."
    required: false
    default: "false"
  servicenow-preview-output:
    description: "Path for the ServiceNow dry-run payload."
    required: false
    default: "servicenow-preview.json"
  jira:
    description: "Optional Jira base URL for opt-in live ticket push. Credentials come from the JIRA_EMAIL / JIRA_API_TOKEN / JIRA_PROJECT_KEY environment variables (set them from GitHub Actions secrets)."
    required: false
    default: ""
  assume-yes:
    description: "Skip confirmation prompts for explicitly requested live ServiceNow/Jira push."
    required: false
    default: "false"
  fail-on:
    description: "Minimum risk level that fails the action: none, low, medium, high, or critical."
    required: false
    default: "critical"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.11"

outputs:
  risk-level:
    description: "Assessed risk level (LOW, MEDIUM, HIGH, CRITICAL)."
    value: ${{ steps.assess.outputs.risk-level }}
  risk-score:
    description: "Assessed risk score (0-100)."
    value: ${{ steps.assess.outputs.risk-score }}
  report-path:
    description: "Path to the generated Markdown report."
    value: ${{ steps.assess.outputs.report-path }}
  json-report-path:
    description: "Path to the generated JSON report."
    value: ${{ steps.assess.outputs.json-report-path }}
  evidence-v2-path:
    description: "Path to signed DSSE Evidence Contract v2 when requested."
    value: ${{ steps.assess.outputs.evidence-v2-path }}
  evidence-v1-path:
    description: "Path to compatibility Evidence Contract v1 when requested."
    value: ${{ steps.assess.outputs.evidence-v1-path }}
  ticket-path:
    description: "Path to the generated change ticket summary (empty when ticket-output was not set)."
    value: ${{ steps.assess.outputs.ticket-path }}
  html-report-path:
    description: "Path to the static HTML report (empty when html-output was not set)."
    value: ${{ steps.assess.outputs.html-report-path }}
  github-comment-path:
    description: "Path to the compact pull-request comment Markdown."
    value: ${{ steps.assess.outputs.github-comment-path }}
  assessment-report-json-path:
    description: "Path to canonical Assessment Report v1 JSON when requested."
    value: ${{ steps.assess.outputs.assessment-report-json-path }}
  assessment-report-markdown-path:
    description: "Path to the full Assessment Report v1 Markdown when requested."
    value: ${{ steps.assess.outputs.assessment-report-markdown-path }}
  assessment-pr-summary-path:
    description: "Path to the bounded Assessment Contract PR summary when requested."
    value: ${{ steps.assess.outputs.assessment-pr-summary-path }}
  assessment-ticket-summary-path:
    description: "Path to the bounded Assessment Contract ticket summary when requested."
    value: ${{ steps.assess.outputs.assessment-ticket-summary-path }}
  changed-files-path:
    description: "Path to the detected or caller-provided changed-file manifest."
    value: ${{ steps.changes.outputs.path }}
  scanner-scope:
    description: "Comma-separated scanners inferred from pull-request filenames."
    value: ${{ steps.assess.outputs.scanner-scope }}
  servicenow-preview-path:
    description: "Path to the ServiceNow dry-run payload when requested."
    value: ${{ steps.assess.outputs.servicenow-preview-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install PreflightOps
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Detect pull request files
      id: changes
      shell: bash
      env:
        PFO_CHANGED_FILES: ${{ inputs.changed-files }}
        PFO_AUTO_DETECT: ${{ inputs.auto-detect-changes }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        path=""
        if [ -n "$PFO_CHANGED_FILES" ]; then
          if [ ! -f "$PFO_CHANGED_FILES" ]; then
            echo "::error::changed-files does not exist: $PFO_CHANGED_FILES"
            exit 2
          fi
          path="$PFO_CHANGED_FILES"
        else
          auto_detect=$(echo "$PFO_AUTO_DETECT" | tr '[:upper:]' '[:lower:]')
          if [ "$auto_detect" = "true" ] && { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; }; then
            generated="${RUNNER_TEMP}/preflightops-changed-files.json"
            if python -m preflightops.changed_files --output "$generated"; then
              path="$generated"
            else
              echo "::warning::Changed-file detection was unavailable; continuing with explicit scanner inputs. Grant pull-requests: read to enable it."
            fi
          fi
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Run PreflightOps risk assessment
      id: assess
      shell: bash
      env:
        PFO_SERVICES: ${{ inputs.services }}
        PFO_CHANGE: ${{ inputs.change }}
        PFO_TERRAFORM: ${{ inputs.terraform }}
        PFO_TERRAFORM_JSON: ${{ inputs.terraform-json }}
        PFO_K8S: ${{ inputs.k8s }}
        PFO_POLICY: ${{ inputs.policy }}
        PFO_POLICY_PUBLIC_KEY: ${{ inputs.policy-public-key }}
        PFO_WAIVER: ${{ inputs.waiver }}
        PFO_WAIVER_PUBLIC_KEY: ${{ inputs.waiver-public-key }}
        PFO_MONITORS: ${{ inputs.monitors }}
        PFO_CHANGED_FILES: ${{ steps.changes.outputs.path }}
        PFO_OUTPUT: ${{ inputs.output }}
        PFO_JSON: ${{ inputs.json-output }}
        PFO_EVIDENCE_V2: ${{ inputs.evidence-v2-output }}
        PFO_EVIDENCE_V1: ${{ inputs.evidence-v1-output }}
        PFO_EVIDENCE_CLASSIFICATION: ${{ inputs.evidence-data-classification }}
        PFO_HTML: ${{ inputs.html-output }}
        PFO_GITHUB_COMMENT: ${{ inputs.github-comment-output }}
        PFO_ASSESSMENT_CONTRACT: ${{ inputs.assessment-contract }}
        PFO_ASSESSMENT_REPORT_JSON: ${{ inputs.assessment-report-json-output }}
        PFO_ASSESSMENT_REPORT_MARKDOWN: ${{ inputs.assessment-report-markdown-output }}
        PFO_ASSESSMENT_PR_SUMMARY: ${{ inputs.assessment-pr-summary-output }}
        PFO_ASSESSMENT_TICKET_SUMMARY: ${{ inputs.assessment-ticket-summary-output }}
        PFO_ASSESSMENT_AUTOMATION_DETAILS: ${{ inputs.assessment-automation-details }}
        PFO_FULL_REPORT_URL: ${{ inputs.full-report-url }}
        PFO_TICKET: ${{ inputs.ticket-output }}
        PFO_TICKET_TEMPLATE: ${{ inputs.ticket-template }}
        PFO_SERVICENOW: ${{ inputs.servicenow }}
        PFO_SERVICENOW_MAPPING: ${{ inputs.servicenow-mapping }}
        PFO_SERVICENOW_CHANGE: ${{ inputs.servicenow-change }}
        PFO_SERVICENOW_ATTACH_EVIDENCE: ${{ inputs.servicenow-attach-evidence }}
        PFO_SERVICENOW_DRY_RUN: ${{ inputs.servicenow-dry-run }}
        PFO_SERVICENOW_PREVIEW: ${{ inputs.servicenow-preview-output }}
        PFO_JIRA: ${{ inputs.jira }}
        PFO_ASSUME_YES: ${{ inputs.assume-yes }}
        PFO_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail

        args=(--services "$PFO_SERVICES" --change "$PFO_CHANGE")
        if [ -n "$PFO_TERRAFORM" ] && [ -f "$PFO_TERRAFORM" ]; then
          args+=(--terraform "$PFO_TERRAFORM")
        fi
        if [ -n "$PFO_TERRAFORM_JSON" ] && [ -f "$PFO_TERRAFORM_JSON" ]; then
          args+=(--terraform-json "$PFO_TERRAFORM_JSON")
        fi
        if [ -n "$PFO_K8S" ] && [ -f "$PFO_K8S" ]; then
          args+=(--k8s "$PFO_K8S")
        fi
        if [ -n "$PFO_POLICY" ]; then
          args+=(--policy "$PFO_POLICY")
        fi
        if [ -n "$PFO_POLICY_PUBLIC_KEY" ]; then
          if [ ! -f "$PFO_POLICY_PUBLIC_KEY" ]; then
            echo "::error::policy-public-key does not exist: $PFO_POLICY_PUBLIC_KEY"
            exit 2
          fi
          args+=(--policy-public-key "$PFO_POLICY_PUBLIC_KEY")
        fi
        if [ -n "$PFO_WAIVER" ]; then
          if [ ! -f "$PFO_WAIVER" ]; then
            echo "::error::waiver does not exist: $PFO_WAIVER"
            exit 2
          fi
          args+=(--waiver "$PFO_WAIVER")
        fi
        if [ -n "$PFO_WAIVER_PUBLIC_KEY" ]; then
          if [ ! -f "$PFO_WAIVER_PUBLIC_KEY" ]; then
            echo "::error::waiver-public-key does not exist: $PFO_WAIVER_PUBLIC_KEY"
            exit 2
          fi
          args+=(--waiver-public-key "$PFO_WAIVER_PUBLIC_KEY")
        fi
        if [ -n "$PFO_MONITORS" ] && [ -f "$PFO_MONITORS" ]; then
          args+=(--monitors "$PFO_MONITORS")
        fi
        if [ -n "$PFO_CHANGED_FILES" ] && [ -f "$PFO_CHANGED_FILES" ]; then
          args+=(--changed-files "$PFO_CHANGED_FILES" --repository-root "$GITHUB_WORKSPACE")
        fi
        args+=(--output "$PFO_OUTPUT" --json-output "$PFO_JSON")
        if [ -n "$PFO_HTML" ]; then
          args+=(--html-output "$PFO_HTML")
        fi
        if [ -n "$PFO_GITHUB_COMMENT" ]; then
          args+=(--github-comment-output "$PFO_GITHUB_COMMENT")
        fi
        full_report_url="$PFO_FULL_REPORT_URL"
        if [ -z "$full_report_url" ] && [ -n "${GITHUB_SERVER_URL:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ] && [ -n "${GITHUB_RUN_ID:-}" ]; then
          full_report_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        fi
        if [ -n "$full_report_url" ]; then
          args+=(--full-report-url "$full_report_url")
        fi

        # Optional, copy/paste-ready change ticket summary (offline; no network).
        if [ -n "$PFO_TICKET" ]; then
          args+=(--ticket-output "$PFO_TICKET")
        fi
        if [ -n "$PFO_TICKET_TEMPLATE" ]; then
          args+=(--ticket-template "$PFO_TICKET_TEMPLATE")
        fi

        # Opt-in live push. Only added when a non-empty instance/base URL is
        # given; credentials are read from the environment (SERVICENOW_USER /
        # SERVICENOW_PASSWORD, JIRA_EMAIL / JIRA_API_TOKEN / JIRA_PROJECT_KEY)
        # and are never passed on the command line.
        if [ -n "$PFO_SERVICENOW" ]; then
          args+=(--servicenow "$PFO_SERVICENOW")
        fi
        if [ -n "$PFO_SERVICENOW_MAPPING" ]; then
          args+=(--servicenow-mapping "$PFO_SERVICENOW_MAPPING")
        fi
        if [ -n "$PFO_SERVICENOW_CHANGE" ]; then
          args+=(--servicenow-change "$PFO_SERVICENOW_CHANGE")
        fi
        attach_evidence=$(echo "$PFO_SERVICENOW_ATTACH_EVIDENCE" | tr '[:upper:]' '[:lower:]')
        if [ "$attach_evidence" = "true" ]; then
          args+=(--servicenow-attach-evidence)
        fi
        servicenow_dry_run=$(echo "$PFO_SERVICENOW_DRY_RUN" | tr '[:upper:]' '[:lower:]')
        if [ "$servicenow_dry_run" = "true" ]; then
          args+=(--servicenow-dry-run --servicenow-preview-output "$PFO_SERVICENOW_PREVIEW")
        fi
        if [ -n "$PFO_JIRA" ]; then
          args+=(--jira "$PFO_JIRA")
        fi

        # A live push has no interactive terminal in CI, so it is skipped unless
        # confirmation is waived. Map the action's assume-yes input to --yes.
        assume_yes=$(echo "$PFO_ASSUME_YES" | tr '[:upper:]' '[:lower:]')
        if [ "$assume_yes" = "true" ]; then
          args+=(--yes)
        fi

        cli_exit=0
        preflightops "${args[@]}" || cli_exit=$?

        # Exit code 2 means an input/parse/runtime error: fail hard.
        if [ "$cli_exit" -eq 2 ]; then
          echo "::error::PreflightOps failed to run (exit code 2)."
          exit 2
        fi

        # Additive Assessment Contract reporting. No network call or publication
        # is performed; consumers explicitly provide both the contract and paths.
        if [ -n "$PFO_ASSESSMENT_CONTRACT" ]; then
          if [ ! -f "$PFO_ASSESSMENT_CONTRACT" ]; then
            echo "::error::assessment-contract does not exist: $PFO_ASSESSMENT_CONTRACT"
            exit 2
          fi
          assessment_args=(report render --assessment "$PFO_ASSESSMENT_CONTRACT")
          requested_assessment_output=false
          if [ -n "$PFO_ASSESSMENT_REPORT_JSON" ]; then
            assessment_args+=(--json-output "$PFO_ASSESSMENT_REPORT_JSON")
            requested_assessment_output=true
          fi
          if [ -n "$PFO_ASSESSMENT_REPORT_MARKDOWN" ]; then
            assessment_args+=(--markdown-output "$PFO_ASSESSMENT_REPORT_MARKDOWN")
            requested_assessment_output=true
          fi
          if [ -n "$PFO_ASSESSMENT_PR_SUMMARY" ]; then
            assessment_args+=(--pr-summary-output "$PFO_ASSESSMENT_PR_SUMMARY")
            requested_assessment_output=true
          fi
          if [ -n "$PFO_ASSESSMENT_TICKET_SUMMARY" ]; then
            assessment_args+=(--ticket-summary-output "$PFO_ASSESSMENT_TICKET_SUMMARY")
            requested_assessment_output=true
          fi
          if [ "$requested_assessment_output" != "true" ]; then
            echo "::error::assessment-contract requires at least one explicit Assessment Report output path."
            exit 2
          fi
          automation_details=$(echo "$PFO_ASSESSMENT_AUTOMATION_DETAILS" | tr '[:upper:]' '[:lower:]')
          if [ "$automation_details" != "true" ]; then
            assessment_args+=(--without-automation-details)
          fi
          if [ -n "$full_report_url" ]; then
            assessment_args+=(--full-report-url "$full_report_url")
          fi
          if ! preflightops "${assessment_args[@]}"; then
            echo "::error::Assessment Contract reporting failed closed."
            exit 2
          fi
        elif [ -n "$PFO_ASSESSMENT_REPORT_JSON$PFO_ASSESSMENT_REPORT_MARKDOWN$PFO_ASSESSMENT_PR_SUMMARY$PFO_ASSESSMENT_TICKET_SUMMARY" ]; then
          echo "::error::Assessment Report outputs require assessment-contract."
          exit 2
        fi

        level=$(python -c "import json, os; print(json.load(open(os.environ['PFO_JSON']))['risk_level'])")
        score=$(python -c "import json, os; print(json.load(open(os.environ['PFO_JSON']))['risk_score'])")
        scope=$(python -c "import json, os; print(','.join(json.load(open(os.environ['PFO_JSON'])).get('change_scope', {}).get('scanners', [])))")

        # Authenticated evidence is opt-in and signed only in memory from the
        # caller-provided PREFLIGHTOPS_EVIDENCE_PRIVATE_KEY secret. The secret
        # is never accepted as an Action input or command-line value.
        if [ -n "$PFO_EVIDENCE_V2" ]; then
          evidence_args=(evidence generate --assessment "$PFO_JSON" --change "$PFO_CHANGE" --output "$PFO_EVIDENCE_V2" --classification "$PFO_EVIDENCE_CLASSIFICATION")
          evidence_args+=(--input "services=$PFO_SERVICES" --input "change=$PFO_CHANGE")
          if [ -n "$PFO_POLICY" ] && [ -f "$PFO_POLICY" ]; then
            evidence_args+=(--policy "$PFO_POLICY" --input "policy=$PFO_POLICY")
          fi
          if [ -n "$PFO_TERRAFORM" ] && [ -f "$PFO_TERRAFORM" ]; then
            evidence_args+=(--input "terraform=$PFO_TERRAFORM")
          fi
          if [ -n "$PFO_TERRAFORM_JSON" ] && [ -f "$PFO_TERRAFORM_JSON" ]; then
            evidence_args+=(--input "terraform-json=$PFO_TERRAFORM_JSON")
          fi
          if [ -n "$PFO_K8S" ] && [ -f "$PFO_K8S" ]; then
            evidence_args+=(--input "kubernetes=$PFO_K8S")
          fi
          if [ -n "$PFO_MONITORS" ] && [ -f "$PFO_MONITORS" ]; then
            evidence_args+=(--input "monitors=$PFO_MONITORS")
          fi
          if [ -n "$PFO_EVIDENCE_V1" ]; then
            evidence_args+=(--legacy-output "$PFO_EVIDENCE_V1")
          fi
          if ! preflightops "${evidence_args[@]}"; then
            echo "::error::Authenticated evidence generation failed closed."
            exit 2
          fi
        elif [ -n "$PFO_EVIDENCE_V1" ]; then
          echo "::error::evidence-v1-output requires evidence-v2-output during the compatibility window."
          exit 2
        fi

        {
          echo "risk-level=$level"
          echo "risk-score=$score"
          echo "report-path=$PFO_OUTPUT"
          echo "json-report-path=$PFO_JSON"
          echo "evidence-v2-path=$PFO_EVIDENCE_V2"
          echo "evidence-v1-path=$PFO_EVIDENCE_V1"
          echo "ticket-path=$PFO_TICKET"
          echo "html-report-path=$PFO_HTML"
          echo "github-comment-path=$PFO_GITHUB_COMMENT"
          echo "assessment-report-json-path=$PFO_ASSESSMENT_REPORT_JSON"
          echo "assessment-report-markdown-path=$PFO_ASSESSMENT_REPORT_MARKDOWN"
          echo "assessment-pr-summary-path=$PFO_ASSESSMENT_PR_SUMMARY"
          echo "assessment-ticket-summary-path=$PFO_ASSESSMENT_TICKET_SUMMARY"
          echo "scanner-scope=$scope"
          if [ "$servicenow_dry_run" = "true" ]; then
            echo "servicenow-preview-path=$PFO_SERVICENOW_PREVIEW"
          else
            echo "servicenow-preview-path="
          fi
        } >> "$GITHUB_OUTPUT"

        echo "PreflightOps risk: $level ($score/100)"

        # Gate the job based on fail-on.
        # Use a case statement (not associative arrays) so this works on
        # macOS runners, which ship Bash 3.2 and lack "declare -A".
        case "$level" in
          LOW) lv=0 ;;
          MEDIUM) lv=1 ;;
          HIGH) lv=2 ;;
          CRITICAL) lv=3 ;;
          *) lv=0 ;;
        esac

        fail_on=$(echo "$PFO_FAIL_ON" | tr '[:upper:]' '[:lower:]')
        case "$fail_on" in
          none) th=99 ;;
          low) th=0 ;;
          medium) th=1 ;;
          high) th=2 ;;
          critical) th=3 ;;
          *)
            echo "::warning::Unknown fail-on value '$PFO_FAIL_ON'; defaulting to 'critical'."
            th=3
            ;;
        esac

        if [ "$lv" -ge "$th" ]; then
          echo "::error::PreflightOps risk level $level meets or exceeds fail-on threshold ($PFO_FAIL_ON)."
          exit 1
        fi
